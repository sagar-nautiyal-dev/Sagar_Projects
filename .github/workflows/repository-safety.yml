name: Repository safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-and-notebook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repository text
        run: python retail-trade-forecasting/scripts/privacy_scan.py .
      - name: Validate executed notebook and outputs
        run: python retail-trade-forecasting/scripts/validate_notebook.py
